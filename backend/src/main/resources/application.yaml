spring:
  application:
    name: drift-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/drift
    username: drift
    password: drift

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS_ENABLE:false}
      mail.smtp.starttls.required: ${MAIL_SMTP_STARTTLS_REQUIRED:false}
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 3000
      mail.smtp.writetimeout: 3000

server:
  port: 8080

app:
  # One origin and sender identity are shared across invitation, reset, and risk-alert mail.
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM_ADDRESS:noreply@localhost}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:28800000}
  # Operator-only gate for the one-time first administrator. Leave unset to keep setup closed.
  setup:
    token: ${DRIFT_SETUP_TOKEN:}
  session:
    cookie:
      # Local HTTP stays usable. Set SESSION_COOKIE_SECURE=true when the site is served only over HTTPS.
      secure: ${SESSION_COOKIE_SECURE:false}
  password-reset:
    link-base-url: ${PASSWORD_RESET_LINK_BASE_URL:${app.frontend-base-url}/reset-password}
    ttl: ${PASSWORD_RESET_TTL:1h}
    from: ${app.mail.from}
    rate-limit:
      email: ${PASSWORD_RESET_EMAIL_LIMIT:5}
      ip: ${PASSWORD_RESET_IP_LIMIT:20}
      window: ${PASSWORD_RESET_RATE_WINDOW:15m}
  invitation:
    link-base-url: ${INVITATION_LINK_BASE_URL:${app.frontend-base-url}/signup}
    ttl: ${INVITATION_TTL:7d}
    from: ${app.mail.from}
  risk-alerts:
    activation:
      command: ${RISK_ALERTS_ACTIVATION_COMMAND:false}
    # Explicit activation is a separate operator action; feature flags never create an activation generation.
    evaluation:
      enabled: ${RISK_ALERTS_EVALUATION_ENABLED:false}
      interval: ${RISK_ALERTS_EVALUATION_INTERVAL:15m}
      batch-size: ${RISK_ALERTS_EVALUATION_BATCH_SIZE:100}
    mail:
      # Stays off until an operator enables it. Sender and frontend origin are shared with account mail.
      enabled: ${RISK_ALERTS_MAIL_ENABLED:false}
      frontend-base-url: ${RISK_ALERTS_FRONTEND_BASE_URL:${app.frontend-base-url}}
      from: ${app.mail.from}
      claim-lease: ${RISK_ALERTS_CLAIM_LEASE:1m}
      dispatch-enabled: ${RISK_ALERTS_DISPATCH_ENABLED:false}
      poll-interval: ${RISK_ALERTS_POLL_INTERVAL:1m}
      batch-size: ${RISK_ALERTS_BATCH_SIZE:50}
  ais:
    enabled: ${AIS_ENABLED:false}
    capture-directory: ${AIS_CAPTURE_DIRECTORY:}
    stream-uri: wss://stream.aisstream.io/v0/stream
    api-key: ${AISSTREAM_API_KEY:}
    southwest-latitude: ${AIS_SOUTHWEST_LATITUDE:}
    southwest-longitude: ${AIS_SOUTHWEST_LONGITUDE:}
    northeast-latitude: ${AIS_NORTHEAST_LATITUDE:}
    northeast-longitude: ${AIS_NORTHEAST_LONGITUDE:}
  shipment-import:
    max-upload-bytes: 5242880
  maritime-context:
    # CDG-246 is a read-only recorded/synthetic bundle until persistent snapshot adapters are approved.
    demo-enabled: ${MARITIME_CONTEXT_DEMO_ENABLED:false}
    # CDG-248 packaged historical replay; never points at a collector directory or live API.
    curated-snapshots-enabled: ${MARITIME_CONTEXT_CURATED_SNAPSHOTS_ENABLED:false}
    # Local/staging-only fictional replay; stage changes require an application restart.
    controlled-replay-enabled: ${MARITIME_CONTEXT_CONTROLLED_REPLAY_ENABLED:false}
    controlled-replay-stage: ${MARITIME_CONTEXT_CONTROLLED_REPLAY_STAGE:BASELINE}
    # Optional local/test cutoff for ordinary maritime context. Empty uses the system clock.
    # It does not change authentication, freshness rules, or the production default.
    assessment-cutoff: ${MARITIME_CONTEXT_ASSESSMENT_CUTOFF:}
  controlled-scenario:
    # Keep the session API absent from usable deployments unless explicitly configured for an isolated demo.
    enabled: ${CONTROLLED_SCENARIO_ENABLED:false}
    demo-company-id: ${CONTROLLED_SCENARIO_DEMO_COMPANY_ID:}
    allowed-user-ids: ${CONTROLLED_SCENARIO_ALLOWED_USER_IDS:}
    shipment-a-id: ${CONTROLLED_SCENARIO_SHIPMENT_A_ID:}
    shipment-b-id: ${CONTROLLED_SCENARIO_SHIPMENT_B_ID:}
    session-ttl: ${CONTROLLED_SCENARIO_SESSION_TTL:4h}
    max-sessions: ${CONTROLLED_SCENARIO_MAX_SESSIONS:100}
    max-commands-per-session: ${CONTROLLED_SCENARIO_MAX_COMMANDS_PER_SESSION:64}
  maritime-ai:
    enabled: ${MARITIME_AI_ENABLED:false}
    # Separate explicit UI-requested controlled-scenario inference gate; the provider approval gate still applies.
    scenario-enabled: ${MARITIME_AI_SCENARIO_ENABLED:false}
    # Offline-only client for the controlled fictional replay. Never sends a provider request.
    controlled-replay-stub-enabled: ${MARITIME_AI_CONTROLLED_REPLAY_STUB_ENABLED:false}
    provider: ${MARITIME_AI_PROVIDER:}
    model: ${MARITIME_AI_MODEL:}
    endpoint: ${MARITIME_AI_ENDPOINT:}
    api-key: ${MARITIME_AI_API_KEY:}
    # A separate approval gate prevents a configured key from causing external inference by accident.
    external-requests-approved: ${MARITIME_AI_EXTERNAL_REQUESTS_APPROVED:false}
    # Authentic retrospective evidence remains excluded unless both switches are explicitly set
    # after source-use and organizational approval. This is not enabled by collector access alone.
    authentic-retrospective-inference-approved: ${MARITIME_AI_AUTHENTIC_RETROSPECTIVE_INFERENCE_APPROVED:false}
    authentic-retrospective-source-types-approved: ${MARITIME_AI_AUTHENTIC_RETROSPECTIVE_SOURCE_TYPES_APPROVED:}
    # Exact curated evidence IDs require their own documented source-use approval. A source
    # type allowlist alone is intentionally insufficient for external transmission.
    authentic-retrospective-evidence-ids-approved: ${MARITIME_AI_AUTHENTIC_RETROSPECTIVE_EVIDENCE_IDS_APPROVED:}
    # Explicit bounds apply to every configured provider request.  The feature
    # remains disabled unless both this flag and provider configuration are set.
    timeout-seconds: ${MARITIME_AI_TIMEOUT_SECONDS:20}
    max-output-tokens: ${MARITIME_AI_MAX_OUTPUT_TOKENS:2000}
  maritime-reassessment:
    # External processing stays off until a dataset, the global gate, and every source type are approved.
    external-processing-enabled: false
    approved-datasets: []
    approved-source-types: []
    max-concurrent-requests: 1
    max-calls-per-minute: 2
    max-estimated-cost-units: 1
    call-timeout: 2s
    max-attempts: 2
