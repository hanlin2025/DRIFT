spring:
  application:
    name: drift-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/drift
    username: drift
    password: drift

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 3000
      mail.smtp.writetimeout: 3000

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 3600000
  password-reset:
    link-base-url: ${PASSWORD_RESET_LINK_BASE_URL:http://localhost:5173/reset-password}
    ttl: ${PASSWORD_RESET_TTL:1h}
    from: ${PASSWORD_RESET_FROM:noreply@localhost}
  risk-alerts:
    activation:
      command: ${RISK_ALERTS_ACTIVATION_COMMAND:false}
    # Explicit activation is a separate operator action; feature flags never create an activation generation.
    evaluation:
      enabled: ${RISK_ALERTS_EVALUATION_ENABLED:false}
      interval: ${RISK_ALERTS_EVALUATION_INTERVAL:15m}
      batch-size: ${RISK_ALERTS_EVALUATION_BATCH_SIZE:100}
    mail:
      enabled: ${RISK_ALERTS_MAIL_ENABLED:false}
      frontend-base-url: ${RISK_ALERTS_FRONTEND_BASE_URL:}
      from: ${RISK_ALERTS_FROM:}
      claim-lease: ${RISK_ALERTS_CLAIM_LEASE:1m}
      dispatch-enabled: ${RISK_ALERTS_DISPATCH_ENABLED:false}
      poll-interval: ${RISK_ALERTS_POLL_INTERVAL:1m}
      batch-size: ${RISK_ALERTS_BATCH_SIZE:50}
  ais:
    enabled: ${AIS_ENABLED:false}
    stream-uri: wss://stream.aisstream.io/v0/stream
    api-key: ${AISSTREAM_API_KEY:}
    southwest-latitude: ${AIS_SOUTHWEST_LATITUDE:}
    southwest-longitude: ${AIS_SOUTHWEST_LONGITUDE:}
    northeast-latitude: ${AIS_NORTHEAST_LATITUDE:}
    northeast-longitude: ${AIS_NORTHEAST_LONGITUDE:}
  shipment-import:
    max-upload-bytes: 5242880
  maritime-context:
    # CDG-246 is a read-only recorded/synthetic bundle until persistent snapshot adapters are approved.
    demo-enabled: ${MARITIME_CONTEXT_DEMO_ENABLED:false}
  maritime-ingest:
    # Live MPA and NEA collection. Off until approved; each source can also be switched off on its own.
    enabled: ${MARITIME_INGEST_ENABLED:false}
    interval: ${MARITIME_INGEST_INTERVAL:15m}
    nea:
      enabled: ${MARITIME_INGEST_NEA_ENABLED:true}
      base-uri: https://api-open.data.gov.sg/v2/real-time/api
      api-key: ${DATA_GOV_SG_API_KEY:}
      ports: [singapore, tanjung pelepas]
      port-radius-km: ${MARITIME_INGEST_NEA_PORT_RADIUS_KM:25}
    mpa-notices:
      enabled: ${MARITIME_INGEST_MPA_NOTICES_ENABLED:true}
      listing-uri: https://www.mpa.gov.sg/api/items/media_releases_and_circulars
      # Port marine notices category, as used by tools/maritime_notices/mpa_official_notices_collect.py.
      category: 2b89298e-3d17-4bf2-8275-9079e84f63d0
      limit: 20
    mpa-oceansx:
      api-key: ${MPA_OCEANSX_API_KEY:}
      base-uri: ${MPA_OCEANSX_API_BASE:}
      due-to-arrive-path: ${MPA_DUE_TO_ARRIVE_PATH:}
      lookahead-days: 3
  delay-attribution:
    # Weather that counts as adverse when NEA weather is used to attribute a shipment's delay.
    adverse-rainfall-mm-per-hour: 10
    adverse-wind-knots: 22
  maritime-reassessment:
    # External processing stays off until a dataset, the global gate, and every source type are approved.
    external-processing-enabled: false
    approved-datasets: []
    approved-source-types: []
    max-concurrent-requests: 1
    max-calls-per-minute: 2
    max-estimated-cost-units: 1
    call-timeout: 2s
    max-attempts: 2
