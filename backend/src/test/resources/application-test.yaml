spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: ${DRIFT_TEST_DATABASE_URL:jdbc:postgresql://localhost:5432/drift_test}
    username: ${DRIFT_TEST_DATABASE_USERNAME:drift}
    password: ${DRIFT_TEST_DATABASE_PASSWORD:drift}

app:
  jwt:
    secret: test-only-jwt-secret-not-used-outside-tests
  password-reset:
    rate-limit:
      # High enough that the shared in-memory limiter never throttles other tests;
      # PasswordResetSecurityTests sets low limits for its own context.
      email: 1000
      ip: 1000
      window: 15m
  signup:
    # Signup endpoints remain disabled in production by default; enable them for the integration suite.
    enabled: true
    rate-limit:
      # High enough that the shared in-memory limiter never throttles other tests;
      # EmailVerificationRateLimitIntegrationTests sets low limits for its own context.
      ip: 1000
      email: 1000
      window: PT1H
  ais:
    enabled: false
  shipment-import:
    max-upload-bytes: 5242880
