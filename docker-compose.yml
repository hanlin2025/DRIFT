services:
  postgres:
    image: postgres:16
    container_name: drift-postgres
    environment:
      POSTGRES_DB: drift
      POSTGRES_USER: drift
      POSTGRES_PASSWORD: drift
    ports:
      - "5432:5432"
    volumes:
      - drift-postgres-data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: drift-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  drift-postgres-data:
